<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Yury Katok — frontend-разработчик. Создаю быстрые, доступные и аккуратные интерфейсы на React и TypeScript."
    />
    <meta name="theme-color" content="#f6f6fa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#08080d" media="(prefers-color-scheme: dark)" />
    <title>Yury Katok — Frontend-разработчик</title>

    <script>
      ;(function () {
        try {
          var theme = localStorage.getItem('theme')
          if (theme !== 'light' && theme !== 'dark') {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          }
          document.documentElement.dataset.theme = theme

          var lang = localStorage.getItem('lang')
          if (lang !== 'ru' && lang !== 'en') {
            lang = (navigator.language || 'en').toLowerCase().indexOf('ru') === 0 ? 'ru' : 'en'
          }
          document.documentElement.lang = lang

          if (localStorage.getItem('motion') === 'on') {
            document.documentElement.dataset.motion = 'on'
          }
        } catch (error) {
          document.documentElement.dataset.theme = 'light'
          document.documentElement.lang = 'ru'
        }
      })()
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
