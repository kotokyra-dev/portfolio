    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Yury Katok",
        "url": "https://portfolio-kotokyra.vercel.app/",
        "image": "https://portfolio-kotokyra.vercel.app/og-image.png",
        "jobTitle": "Frontend Developer",
        "email": "mailto:kotokyura@gmail.com",
        "sameAs": ["https://github.com/kotokyra-dev", "https://t.me/ktk314"],
        "knowsAbout": [
          "React",
          "TypeScript",
          "JavaScript",
          "CSS",
          "Web Performance",
          "Accessibility"
        ]
      }
    </script>

    <script>
      ;(function () {
        try {
          var theme = localStorage.getItem('theme')
          if (theme !== 'light' && theme !== 'dark') {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          }
          document.documentElement.dataset.theme = theme

          var lang = localStorage.getItem('lang')
          if (lang !== 'ru' && lang !== 'en') {
            lang = (navigator.language || 'en').toLowerCase().indexOf('ru') === 0 ? 'ru' : 'en'
          }
          document.documentElement.lang = lang
        } catch (error) {
          document.documentElement.dataset.theme = 'light'
          document.documentElement.lang = 'ru'
        }
      })()
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700;800&display=swap"
